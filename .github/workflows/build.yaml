name: Build

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      BUILD_VERSION: ${{ steps.set_build_version.outputs.BUILD_VERSION }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Execute Git Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Set Build Version
        id: set_build_version
        env:
          BRANCH: ${{ github.ref_name }}
          BASE_VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          if [ "${BRANCH}" != "main" ]; then
            BUILD_VERSION="${BASE_VERSION}-$(date +'%Y%m%d-%H%M%S')"
          else
            BUILD_VERSION="${BASE_VERSION}"
          fi
          echo "build version: ${BUILD_VERSION}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check .NET SDK Version
        run: dotnet --version

      - name: Download Dependencies
        run: dotnet restore

      - name: Build Code
        run: dotnet build

      - name: DotNet Publish
        run: |
          dotnet publish src/Yami.Api/Yami.Api.csproj \
          -c Release \
          --self-contained false \
          -o publish

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: yamicredit/yamibackend:${{env.BUILD_VERSION}}

  deploy_on_northflank:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - name: Install Northflank CLI
        run: npm i -g --no-audit --no-fund @northflank/cli

      - name: Login to Northflank
        run: northflank login --token-login -t ${{ secrets.NORTHFLANK_TOKEN }}

      - name: Create Deployment Payload
        env:
          BUILD_VERSION: ${{ needs.build.outputs.BUILD_VERSION }}
        run: |
            PAYLOAD=$(printf '{"external":{"imagePath":"yamicredit/yamibackend:%s"},"docker":{"configType":"default"}}' "$BUILD_VERSION")
            echo "PAYLOAD=${PAYLOAD}">> "$GITHUB_ENV"

      - name: Deploy to Northflank
        run: |
          echo ""
          echo "deployment payload:"
          echo ${PAYLOAD}
          echo "======== Deploying image to Northflank ========"
          northflank update service deployment --serviceId "yamibackend" --projectId "yamibackend" -i "${PAYLOAD}"
# northflank update service is deprecated but the replacement "patch" command returns too much noise          
#          northflank patch service deployment --serviceId "yamibackend" --projectId "yamibackend" -i "${PAYLOAD}"          